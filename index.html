<!doctype html>

<meta charset="utf-8">

<meta name="mobile-web-app-capable" content="yes">
<meta name="description" content="Offline workout tracker: schedule, calisthenics library, treadmill and cardio logging, weight, blood pressure and nutrition goals.">
<title>Workout Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='14' fill='%232a78d6'/%3E%3Cpath d='M16 24v16M48 24v16M10 28v8M54 28v8M16 32h32' stroke='white' stroke-width='6' stroke-linecap='round'/%3E%3C/svg%3E">
<style>:root {
  color-scheme: light;
  --bg: #f2f4f7; --surface: #ffffff; --surface2: #f5f6f9; --stage: #edf1f7;
  --text: #10131a; --text2: #474f60; --muted: #6f7889; --line: #e2e5ec;
  --accent: #2a78d6; --accent-2: #1f63b8; --accent-ink: #fff; --accent-soft: #e5effb;
  --chip: #eceff4; --good: #157a43; --good-soft: #e3f4ea; --warn: #9a6200; --warn-soft: #fbf0d9; --bad: #c43c3c; --bad-soft: #fbe6e6;
  --series-1: #2a78d6; --series-2: #eb6834; --series-3: #1baf7a; --series-4: #eda100;
  --tier0: #d9dee7; --tier1: #b9d3f2; --tier2: #6fa6e6; --tier3: #2a78d6; --tier4: #154d93;
  --shadow: 0 1px 2px rgba(16, 19, 26, .05), 0 4px 16px rgba(16, 19, 26, .05);
  --fig-shirt: #2a78d6; --fig-pants: #2c3446; --fig-skin: #d6a47c; --fig-hair: #3b2a20; --fig-shoe: #161a22;
  --prop: #c9ced8; --prop2: #98a1b0;
  --r: 16px; --nav-h: 64px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    color-scheme: dark;
    --bg: #0b0e13; --surface: #141921; --surface2: #1a2029; --stage: #1d2430;
    --text: #e8ecf2; --text2: #b9c1cd; --muted: #8b94a4; --line: #252c38;
    --accent: #3987e5; --accent-2: #5b9dec; --accent-soft: #15253a; --chip: #1e2530;
    --good: #2fb26a; --good-soft: #12291d; --warn: #e0a12a; --warn-soft: #2d2311; --bad: #e66767; --bad-soft: #321819;
    --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --tier0: #2a3240; --tier1: #22406a; --tier2: #2f62a6; --tier3: #3987e5; --tier4: #8fbdf3;
    --shadow: none;
    --fig-shirt: #3987e5; --fig-pants: #586379; --fig-skin: #d6a47c; --fig-hair: #6a4a36; --fig-shoe: #c3cad6;
    --prop: #39424f; --prop2: #5f6a7b;
  }
}
:root[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0b0e13; --surface: #141921; --surface2: #1a2029; --stage: #1d2430;
  --text: #e8ecf2; --text2: #b9c1cd; --muted: #8b94a4; --line: #252c38;
  --accent: #3987e5; --accent-2: #5b9dec; --accent-soft: #15253a; --chip: #1e2530;
  --good: #2fb26a; --good-soft: #12291d; --warn: #e0a12a; --warn-soft: #2d2311; --bad: #e66767; --bad-soft: #321819;
  --series-1: #3987e5; --series-2: #d95926; --series-3: #199e70; --series-4: #c98500; --tier0: #2a3240; --tier1: #22406a; --tier2: #2f62a6; --tier3: #3987e5; --tier4: #8fbdf3;
  --shadow: none;
  --fig-shirt: #3987e5; --fig-pants: #586379; --fig-skin: #d6a47c; --fig-hair: #6a4a36; --fig-shoe: #c3cad6;
  --prop: #39424f; --prop2: #5f6a7b;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body { margin: 0; }
body { background: var(--bg); color: var(--text); font: 15px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif; -webkit-font-smoothing: antialiased; overflow-x: hidden; }
button, input, select, textarea { font: inherit; color: inherit; }
button { cursor: pointer; border: 0; background: none; padding: 0; }
a { color: var(--accent); }
h1, h2, h3, h4 { margin: 0; line-height: 1.2; }
h2 { font-size: 18px; } h3 { font-size: 16px; } h4 { font-size: 14px; color: var(--text2); }
p { margin: 0 0 8px; }
.ic { width: 20px; height: 20px; flex: none; fill: none; stroke: currentColor; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; vertical-align: middle; }
.ic.sm { width: 16px; height: 16px; } .ic.lg { width: 26px; height: 26px; }
.ic.fill { fill: currentColor; stroke: none; }
.muted { color: var(--muted); } .t2 { color: var(--text2); } .small { font-size: 13px; } .tiny { font-size: 12px; }
.num { font-variant-numeric: tabular-nums; }
.row { display: flex; align-items: center; gap: 10px; } .row.top { align-items: flex-start; } .row.wrap { flex-wrap: wrap; }
.grow { flex: 1; min-width: 0; } .right { margin-left: auto; } .center { text-align: center; }
.stack > * + * { margin-top: 12px; } .stack.s > * + * { margin-top: 8px; } .stack.l > * + * { margin-top: 18px; }
.ell { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.hide { display: none !important; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

/* ---------- shell ---------- */
#app { min-height: 100vh; }
#hdr { position: sticky; top: 0; z-index: 10; display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top)) 16px 10px; background: color-mix(in srgb, var(--bg) 88%, transparent); backdrop-filter: blur(12px); -webkit-backdrop-filter: blur(12px); }
#hdr .ttl { font-size: 22px; font-weight: 750; letter-spacing: -.01em; }
#hdr .sub { font-size: 13px; color: var(--muted); }
#main { padding: 4px 16px calc(var(--nav-h) + 28px + env(safe-area-inset-bottom)); max-width: 880px; margin: 0 auto; }
#nav { position: fixed; z-index: 20; left: 0; right: 0; bottom: 0; height: calc(var(--nav-h) + env(safe-area-inset-bottom)); padding-bottom: env(safe-area-inset-bottom); display: grid; grid-template-columns: repeat(6, 1fr); background: color-mix(in srgb, var(--surface) 92%, transparent); backdrop-filter: blur(14px); -webkit-backdrop-filter: blur(14px); border-top: 1px solid var(--line); }
#nav button { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; font-size: 11px; min-width: 0; font-weight: 600; color: var(--muted); }
#nav button.on { color: var(--accent); }
#nav .ic { width: 23px; height: 23px; }
@media (min-width: 900px) {
  #nav { top: 0; right: auto; width: 210px; height: 100vh; display: flex; flex-direction: column; padding: 24px 12px; gap: 4px; border-top: 0; border-right: 1px solid var(--line); }
  #nav::before { content: "Workout Tracker"; font-weight: 800; font-size: 18px; padding: 0 12px 18px; color: var(--text); }
  #nav button { flex-direction: row; justify-content: flex-start; gap: 12px; padding: 11px 14px; font-size: 15px; border-radius: 12px; }
  #nav button.on { background: var(--accent-soft); }
  #hdr, #main { margin-left: max(210px, calc(210px + (100vw - 210px - 880px) / 2)); max-width: 880px; }
  #hdr { padding-left: 16px; padding-right: 16px; }
  #main { padding-bottom: 40px; }
}

/* ---------- components ---------- */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--r); padding: 16px; box-shadow: var(--shadow); }
.card.flat { box-shadow: none; }
.card.tight { padding: 12px; }
.card.accent { background: linear-gradient(135deg, var(--accent), var(--accent-2)); color: #fff; border: 0; }
.card.accent .muted, .card.accent .t2 { color: rgba(255, 255, 255, .82); }
.card-h { display: flex; align-items: center; gap: 8px; margin-bottom: 12px; }
.card-h h2, .card-h h3 { flex: 1; }
.sec-h { display: flex; align-items: baseline; gap: 8px; margin: 22px 2px 10px; }
.sec-h h2 { flex: 1; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; min-height: 44px; padding: 0 16px; border-radius: 12px; font-weight: 650; background: var(--chip); color: var(--text); white-space: nowrap; transition: transform .08s, background .15s; }
.btn:active { transform: scale(.97); }
.btn.pri { background: var(--accent); color: var(--accent-ink); }
.btn.good { background: var(--good); color: #fff; }
.btn.danger { background: var(--bad-soft); color: var(--bad); }
.btn.ghost { background: transparent; color: var(--accent); }
.btn.line { background: transparent; border: 1px solid var(--line); }
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13.5px; border-radius: 10px; }
.btn.xs { min-height: 28px; padding: 0 9px; font-size: 12.5px; border-radius: 8px; }
.btn.block { width: 100%; }
.btn.lg { min-height: 54px; font-size: 17px; border-radius: 14px; }
.btn.icon { width: 40px; min-height: 40px; padding: 0; border-radius: 12px; }
.btn.icon.sm { width: 34px; min-height: 34px; }
.btn[disabled] { opacity: .45; pointer-events: none; }
.card.accent .btn { background: rgba(255, 255, 255, .18); color: #fff; }
.card.accent .btn.pri { background: #fff; color: var(--accent-2); }
.btns { display: flex; gap: 8px; flex-wrap: wrap; }
.btns > .btn { flex: 1; }
.chips { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; padding: 2px; margin: 0 -2px; }
.chips::-webkit-scrollbar { display: none; }
.chips.wrap { flex-wrap: wrap; overflow: visible; }
.chip { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 36px; padding: 0 13px; border-radius: 999px; background: var(--chip); font-size: 13.5px; font-weight: 600; border: 1.5px solid transparent; color: var(--text2); }
.chip.on { background: var(--accent-soft); color: var(--accent); border-color: var(--accent); }
.chip.sm { min-height: 28px; padding: 0 10px; font-size: 12.5px; }
.tag { display: inline-flex; align-items: center; gap: 4px; padding: 2px 8px; border-radius: 999px; font-size: 12px; font-weight: 650; background: var(--chip); color: var(--text2); white-space: nowrap; }
.tag.good { background: var(--good-soft); color: var(--good); } .tag.warn { background: var(--warn-soft); color: var(--warn); } .tag.bad { background: var(--bad-soft); color: var(--bad); } .tag.acc { background: var(--accent-soft); color: var(--accent); }
.seg { display: flex; background: var(--chip); border-radius: 12px; padding: 3px; gap: 2px; }
.seg button { flex: 1; min-height: 36px; padding: 0 10px; border-radius: 9px; font-size: 13.5px; font-weight: 650; color: var(--text2); white-space: nowrap; }
.seg button.on { background: var(--surface); color: var(--text); box-shadow: 0 1px 3px rgba(0, 0, 0, .12); }
.seg.scroll { overflow-x: auto; scrollbar-width: none; }
.seg.scroll::-webkit-scrollbar { display: none; }
.field { display: flex; flex-direction: column; gap: 5px; }
.field > span, .lbl { font-size: 13px; font-weight: 650; color: var(--text2); }
input[type=text], input[type=number], input[type=date], input[type=time], input[type=search], select, textarea { width: 100%; min-height: 44px; padding: 0 12px; border-radius: 11px; border: 1px solid var(--line); background: var(--surface2); font-size: 16px; outline: none; }
textarea { padding: 10px 12px; min-height: 80px; resize: vertical; }
input:focus, select:focus, textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
.g2 { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.g3 { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.g4 { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
@media (max-width: 380px) { .g3 { grid-template-columns: 1fr 1fr; } }
.toggle { position: relative; width: 48px; height: 28px; flex: none; }
.toggle input { position: absolute; opacity: 0; inset: 0; margin: 0; cursor: pointer; z-index: 1; }
.toggle i { position: absolute; inset: 0; border-radius: 99px; background: var(--line); transition: .2s; }
.toggle i::after { content: ""; position: absolute; left: 3px; top: 3px; width: 22px; height: 22px; border-radius: 50%; background: #fff; box-shadow: 0 1px 3px rgba(0, 0, 0, .3); transition: .2s; }
.toggle input:checked + i { background: var(--accent); }
.toggle input:checked + i::after { transform: translateX(20px); }
.toggle input:focus-visible + i { box-shadow: 0 0 0 3px var(--accent-soft); }
.list { display: flex; flex-direction: column; }
.li { display: flex; align-items: center; gap: 12px; padding: 12px 0; border-bottom: 1px solid var(--line); }
.li:last-child { border-bottom: 0; }
.li.click { cursor: pointer; }
.li .ttl { font-weight: 650; }
.prog { height: 8px; background: var(--chip); border-radius: 99px; overflow: hidden; }
.prog > i { display: block; height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s; }
.prog.good > i { background: var(--good); }
.dotsel { display: flex; gap: 4px; }
.diff { display: inline-flex; gap: 2px; vertical-align: middle; }
.diff i { width: 6px; height: 6px; border-radius: 50%; background: var(--line); }
.diff i.on { background: var(--accent); }
.empty { text-align: center; padding: 26px 16px; color: var(--muted); }
.empty .ic { width: 34px; height: 34px; margin-bottom: 6px; opacity: .6; }
.kpi { display: flex; flex-direction: column; gap: 2px; padding: 12px; border-radius: 14px; background: var(--surface2); min-width: 0; }
.kpi b { font-size: 22px; font-weight: 750; letter-spacing: -.01em; }
.kpi span { font-size: 12.5px; color: var(--muted); }
.note { padding: 12px 14px; border-radius: 12px; background: var(--surface2); font-size: 13.5px; color: var(--text2); }
.note.warn { background: var(--warn-soft); color: var(--text); }
.note.bad { background: var(--bad-soft); color: var(--text); }
.note.good { background: var(--good-soft); color: var(--text); }
.stepper { display: inline-flex; align-items: center; background: var(--surface2); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
.stepper button { width: 40px; height: 40px; display: flex; align-items: center; justify-content: center; color: var(--accent); }
.stepper input { width: 58px; min-height: 40px; border: 0; border-radius: 0; text-align: center; background: transparent; padding: 0 2px; }
.stepper input:focus { box-shadow: none; }

/* ---------- figure ---------- */
.stage { background: var(--stage); border-radius: 14px; overflow: hidden; }
.fig { width: 100%; height: auto; display: block; }
.fig line, .fig polyline, .fig path.cable { stroke-linecap: round; stroke-linejoin: round; fill: none; }
.fig .fs { stroke: var(--fig-shirt); } .fig .fs-f { fill: var(--fig-shirt); stroke-linejoin: round; }
.fig .fp { stroke: var(--fig-pants); } .fig .fp-f { fill: var(--fig-pants); stroke-linejoin: round; }
.fig .fk { stroke: var(--fig-skin); } .fig .fk-f { fill: var(--fig-skin); }
.fig .fh-f { fill: var(--fig-hair); } .fig .fsh { stroke: var(--fig-shoe); }
.fig .far { opacity: .5; }
.fig .pr { fill: var(--prop); } .fig .pr2, .fig .pr2-f, .fig .grip { fill: var(--prop2); }
.fig .prs { stroke: var(--prop); } .fig .prs2 { stroke: var(--prop2); }
.fig .cable { stroke: var(--muted); }
.fig .floor { stroke: var(--prop); stroke-width: 2; }

/* ---------- today ---------- */
.hero { display: flex; align-items: center; gap: 12px; margin: 6px 0 14px; }
.hero h1 { font-size: 24px; font-weight: 780; letter-spacing: -.015em; }
.qa { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
.qa button { display: flex; flex-direction: column; align-items: flex-start; gap: 8px; padding: 14px 12px; border-radius: 16px; background: var(--surface); border: 1px solid var(--line); text-align: left; font-weight: 650; font-size: 14px; box-shadow: var(--shadow); min-height: 86px; }
.qa button .ic { color: var(--accent); width: 24px; height: 24px; }
@media (min-width: 640px) { .qa { grid-template-columns: repeat(6, 1fr); } }
.goal { display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; align-items: center; }
.goal .prog { grid-column: 1 / -1; }
.plan-row { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); }
.plan-row:last-child { border-bottom: 0; }
.plan-ic { width: 40px; height: 40px; border-radius: 12px; display: flex; align-items: center; justify-content: center; background: var(--accent-soft); color: var(--accent); flex: none; }
.plan-ic.done { background: var(--good-soft); color: var(--good); }
.plan-ic.missed { background: var(--bad-soft); color: var(--bad); }
.prompt { border-left: 4px solid var(--accent); }

/* ---------- calendar ---------- */
.cal-head { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; margin-bottom: 4px; font-size: 12px; color: var(--muted); text-align: center; font-weight: 650; }
.cal { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.cal .d { position: relative; min-height: 54px; border-radius: 11px; background: var(--surface); border: 1px solid var(--line); padding: 5px 6px; text-align: left; font-size: 13px; font-weight: 650; display: flex; flex-direction: column; }
.cal .d.out { opacity: .38; }
.cal .d.today { border-color: var(--accent); box-shadow: inset 0 0 0 1px var(--accent); }
.cal .d.sel { background: var(--accent-soft); }
.cal .dots { display: flex; flex-wrap: wrap; gap: 3px; margin-top: auto; }
.dot { width: 7px; height: 7px; border-radius: 50%; display: inline-block; }
.dot.done { background: var(--good); }
.dot.plan { border: 1.6px solid var(--accent); }
.dot.missed { background: var(--bad); }
.dot.food { background: var(--warn); }
.legend { display: flex; flex-wrap: wrap; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 10px; }
.legend span { display: inline-flex; align-items: center; gap: 5px; }
.wk-day { padding: 12px 0; border-bottom: 1px solid var(--line); }
.wk-day:last-child { border-bottom: 0; }
.wk-day.today .wk-date { color: var(--accent); }
.daychips { display: flex; gap: 6px; }
.daychips button { width: 38px; height: 38px; border-radius: 50%; background: var(--chip); font-weight: 700; font-size: 13px; color: var(--text2); }
.daychips button.on { background: var(--accent); color: #fff; }

/* ---------- library ---------- */
.ex-grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 10px; }
@media (min-width: 640px) { .ex-grid { grid-template-columns: repeat(3, 1fr); } }
@media (min-width: 1100px) { .ex-grid { grid-template-columns: repeat(4, 1fr); } }
.ex-card { display: flex; flex-direction: column; text-align: left; background: var(--surface); border: 1px solid var(--line); border-radius: 16px; overflow: hidden; box-shadow: var(--shadow); position: relative; }
.ex-card .stage { border-radius: 0; }
.ex-card .body { padding: 10px 12px 12px; display: flex; flex-direction: column; gap: 3px; }
.ex-card .nm { font-weight: 700; font-size: 14px; line-height: 1.25; }
.ex-card .star { position: absolute; top: 8px; right: 8px; color: var(--warn); }
.ex-card.off { opacity: .55; }
.ex-row { display: flex; align-items: center; gap: 12px; padding: 8px 0; border-bottom: 1px solid var(--line); }
.ex-row:last-child { border-bottom: 0; }
.thumb { width: 64px; flex: none; border-radius: 10px; overflow: hidden; background: var(--stage); }
.thumb.sm { width: 48px; }
.lvl-tbl { width: 100%; border-collapse: collapse; font-size: 14px; }
.lvl-tbl td, .lvl-tbl th { padding: 8px 6px; border-bottom: 1px solid var(--line); text-align: left; }
.lvl-tbl th { font-size: 12px; color: var(--muted); font-weight: 650; }
.lvl-tbl tr.me td { color: var(--accent); font-weight: 700; }
ol.steps { padding-left: 0; margin: 0; list-style: none; counter-reset: s; }
ol.steps li { counter-increment: s; position: relative; padding: 0 0 10px 36px; }
ol.steps li::before { content: counter(s); position: absolute; left: 0; top: -1px; width: 24px; height: 24px; border-radius: 50%; background: var(--accent-soft); color: var(--accent); font-weight: 750; font-size: 13px; display: flex; align-items: center; justify-content: center; }
ul.dots { margin: 0; padding-left: 18px; } ul.dots li { margin-bottom: 4px; }

/* ---------- sheets ---------- */
.sheet-wrap { position: fixed; inset: 0; z-index: 60; display: flex; align-items: flex-end; justify-content: center; }
.sheet-bg { position: absolute; inset: 0; background: rgba(5, 8, 14, .5); animation: fade .2s; }
.sheet { position: relative; width: 100%; max-width: 680px; max-height: 94vh; max-height: 94dvh; background: var(--surface); border-radius: 22px 22px 0 0; display: flex; flex-direction: column; animation: up .26s cubic-bezier(.2, .9, .3, 1); box-shadow: 0 -10px 40px rgba(0, 0, 0, .25); }
.sheet-h { display: flex; align-items: center; gap: 8px; padding: 14px 14px 10px 20px; border-bottom: 1px solid var(--line); }
.sheet-h h2 { flex: 1; font-size: 18px; }
.sheet-b { padding: 16px 20px 20px; overflow-y: auto; overscroll-behavior: contain; flex: 1; }
.sheet-f { padding: 12px 20px calc(12px + env(safe-area-inset-bottom)); border-top: 1px solid var(--line); display: flex; gap: 8px; }
.sheet-f .btn { flex: 1; }
@media (min-width: 720px) { .sheet-wrap { align-items: center; } .sheet { border-radius: 22px; max-height: 88vh; } }
@keyframes up { from { transform: translateY(40px); opacity: 0; } to { transform: none; opacity: 1; } }
@keyframes fade { from { opacity: 0; } }
#toast { position: fixed; left: 50%; bottom: calc(var(--nav-h) + 18px + env(safe-area-inset-bottom)); transform: translateX(-50%) translateY(20px); background: var(--text); color: var(--bg); padding: 11px 18px; border-radius: 12px; font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: .25s; z-index: 90; max-width: calc(100vw - 32px); text-align: center; }
#toast.on { opacity: 1; transform: translateX(-50%); }

/* ---------- player ---------- */
#player { position: fixed; inset: 0; z-index: 50; background: var(--bg); display: none; flex-direction: column; }
#player.on { display: flex; }
.pl-top { display: flex; align-items: center; gap: 8px; padding: calc(10px + env(safe-area-inset-top)) 12px 8px; }
.pl-top .nm { flex: 1; font-weight: 700; text-align: center; min-width: 0; }
.pl-prog { height: 4px; background: var(--chip); margin: 0 16px; border-radius: 9px; overflow: hidden; }
.pl-prog i { display: block; height: 100%; background: var(--accent); transition: width .3s; }
.pl-body { flex: 1; overflow-y: auto; padding: 12px 16px 16px; display: flex; flex-direction: column; gap: 12px; max-width: 640px; width: 100%; margin: 0 auto; }
.pl-stage { border-radius: 18px; }
.pl-stage .fig { max-height: 34vh; }
.pl-ex { text-align: center; }
.pl-ex h2 { font-size: 24px; font-weight: 780; }
.pl-target { display: flex; align-items: center; justify-content: center; gap: 14px; }
.pl-target .big { font-size: 56px; font-weight: 800; letter-spacing: -.03em; min-width: 110px; text-align: center; line-height: 1; }
.pl-target .unit { font-size: 15px; color: var(--muted); font-weight: 650; }
.pl-target .stepbtn { width: 54px; height: 54px; border-radius: 50%; background: var(--chip); color: var(--accent); display: flex; align-items: center; justify-content: center; }
.ring { position: relative; width: 200px; height: 200px; margin: 0 auto; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring circle { fill: none; stroke-width: 10; }
.ring .bgc { stroke: var(--chip); } .ring .fgc { stroke: var(--accent); stroke-linecap: round; transition: stroke-dashoffset .25s linear; }
.ring.rest .fgc { stroke: var(--good); }
.ring .lab { position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; }
.ring .lab b { font-size: 50px; font-weight: 800; letter-spacing: -.03em; line-height: 1; }
.pl-foot { padding: 12px 16px calc(14px + env(safe-area-inset-bottom)); display: flex; gap: 10px; max-width: 640px; width: 100%; margin: 0 auto; }
.pl-foot .btn { flex: 1; }
.pl-next { display: flex; align-items: center; gap: 12px; padding: 10px 12px; border-radius: 14px; background: var(--surface); border: 1px solid var(--line); }
.fb-opts { display: grid; grid-template-columns: repeat(5, 1fr); gap: 6px; }
.fb-opts button { padding: 10px 2px; border-radius: 12px; background: var(--chip); font-size: 12px; font-weight: 650; display: flex; flex-direction: column; align-items: center; gap: 4px; border: 1.5px solid transparent; color: var(--text2); }
.fb-opts button b { font-size: 18px; color: var(--text); }
.fb-opts button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }
.adj { display: flex; gap: 4px; }
.adj button { min-width: 44px; height: 34px; padding: 0 8px; border-radius: 9px; background: var(--chip); font-size: 12.5px; font-weight: 700; color: var(--text2); border: 1.5px solid transparent; }
.adj button.on { border-color: var(--accent); background: var(--accent-soft); color: var(--accent); }

/* ---------- charts ---------- */
.chart { position: relative; }
.chart svg { width: 100%; display: block; overflow: visible; }
.chart .grid line { stroke: var(--line); stroke-width: 1; }
.chart .axis text { fill: var(--muted); font-size: 11px; }
.chart .ln { fill: none; stroke-width: 2; stroke-linejoin: round; stroke-linecap: round; }
.chart .ref { stroke: var(--muted); stroke-dasharray: 4 4; stroke-width: 1; }
.chart .reftxt { fill: var(--muted); font-size: 10.5px; }
.chart .lbl { font-size: 11.5px; font-weight: 650; fill: var(--text2); }
.chart .xh { stroke: var(--muted); stroke-width: 1; }
.chart .tip { position: absolute; pointer-events: none; background: var(--text); color: var(--bg); font-size: 12.5px; padding: 6px 9px; border-radius: 8px; white-space: nowrap; transform: translate(-50%, -110%); opacity: 0; transition: opacity .12s; z-index: 2; }
.chart .tip.on { opacity: 1; }
.chart .bar { fill: var(--series-1); }
.chart .bar.dim { opacity: .45; }
.ch-legend { display: flex; gap: 14px; font-size: 12.5px; color: var(--text2); margin-bottom: 6px; }
.ch-legend i { display: inline-block; width: 14px; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: 5px; }

/* ---------- onboarding ---------- */
#ob { position: fixed; inset: 0; z-index: 40; background: var(--bg); overflow-y: auto; }
.ob-in { max-width: 560px; margin: 0 auto; padding: calc(24px + env(safe-area-inset-top)) 20px 120px; }
.ob-steps { display: flex; gap: 6px; margin-bottom: 22px; }
.ob-steps i { flex: 1; height: 4px; border-radius: 9px; background: var(--chip); }
.ob-steps i.on { background: var(--accent); }
.ob-foot { position: fixed; left: 0; right: 0; bottom: 0; padding: 12px 20px calc(14px + env(safe-area-inset-bottom)); background: var(--bg); border-top: 1px solid var(--line); }
.ob-foot .in { max-width: 560px; margin: 0 auto; display: flex; gap: 10px; }
.ob-foot .btn { flex: 1; }
.opt { display: flex; align-items: center; gap: 12px; padding: 14px; border-radius: 14px; background: var(--surface); border: 1.5px solid var(--line); text-align: left; width: 100%; }
.opt.on { border-color: var(--accent); background: var(--accent-soft); }
.opt .ttl { font-weight: 700; }
.bigtitle { font-size: 28px; font-weight: 800; letter-spacing: -.02em; line-height: 1.15; }

.heat { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; }
.heat i { aspect-ratio: 1; border-radius: 5px; background: var(--chip); display: block; }
.heat i.l1 { background: color-mix(in srgb, var(--good) 35%, var(--chip)); }
.heat i.l2 { background: color-mix(in srgb, var(--good) 65%, var(--chip)); }
.heat i.l3 { background: var(--good); }
.heat i.today { outline: 2px solid var(--accent); outline-offset: 1px; }
.water { display: flex; gap: 6px; flex-wrap: wrap; }
.water button { width: 34px; height: 40px; border-radius: 8px 8px 12px 12px; border: 1.5px solid var(--accent); color: var(--accent); display: flex; align-items: center; justify-content: center; }
.water button.on { background: var(--accent); color: #fff; }
.check { display: flex; align-items: center; gap: 12px; padding: 11px 0; border-bottom: 1px solid var(--line); width: 100%; text-align: left; }
.check:last-child { border-bottom: 0; }
.check .box { width: 26px; height: 26px; border-radius: 8px; border: 2px solid var(--line); display: flex; align-items: center; justify-content: center; flex: none; color: transparent; }
.check.on .box { background: var(--good); border-color: var(--good); color: #fff; }

:root[data-theme="dark"] .tcell.t1 { color: #fff; }

.sb-work { background: var(--accent); } .sb-rest { background: var(--good); } .sb-ready { background: var(--chip); } .sb-wc { background: var(--prop2); }

.phase.rest { background: var(--good); } .phase.ready { background: var(--warn); } .phase.wc { background: var(--prop2); }
.tapcount { display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; width: 100%; min-height: 84px; border-radius: 18px; border: 2px dashed var(--accent); color: var(--accent); }

.pl-body > * { flex-shrink: 0; }

<script>/* ---- figure.js ---- */
/* ============================================================
   Figure engine: draws a clothed male figure (t-shirt, long
   training pants, shoes) in side or front view. Poses are
   described by hip position, torso angle and hand/foot targets;
   limbs are solved with two-bone inverse kinematics so keyframes
   can be blended smoothly for animation.
   Coordinates: x 0..200, y = height above floor (0 = floor).
   ============================================================ */
const Fig = (() => {
  const L = { th: 25, sh: 25, ua: 18, fa: 17, tor: 32, neck: 5, head: 7.5 };
  const FLOOR = 125;
  const D2R = Math.PI / 180;
  const pol = (o, a, l) => [o[0] + Math.cos(a * D2R) * l, o[1] + Math.sin(a * D2R) * l];
  const lerp = (a, b, k) => a + (b - a) * k;
  const lerp2 = (a, b, k) => [lerp(a[0], b[0], k), lerp(a[1], b[1], k)];
  const add = (a, b) => [a[0] + b[0], a[1] + b[1]];
  const angOf = (a, b) => Math.atan2(b[1] - a[1], b[0] - a[0]) / D2R;

  function ik(root, tg, l1, l2, s) {
    const dx = tg[0] - root[0], dy = tg[1] - root[1];
    let d = Math.hypot(dx, dy) || 0.001;
    const ux = dx / d, uy = dy / d;
    d = Math.min(Math.max(d, Math.abs(l1 - l2) + 0.5), l1 + l2 - 0.05);
    const a = (l1 * l1 - l2 * l2 + d * d) / (2 * d);
    const h = Math.sqrt(Math.max(0, l1 * l1 - a * a));
    return [[root[0] + ux * a - uy * h * s, root[1] + uy * a + ux * h * s], [root[0] + ux * d, root[1] + uy * d]];
  }

  function frame(p) {
    const front = p.view === 'front';
    const t = p.tor ?? 90, hd = t + (p.hd || 0);
    const hip = p.hip, sh = pol(hip, t, L.tor);
    return {
      front, t, hd, hip, sh,
      neck: pol(sh, hd, L.neck + 1.5),
      head: pol(sh, hd, L.neck + L.head),
      sr: front ? [pol(sh, t - 90, 9), pol(sh, t + 90, 9)] : [sh, sh],
      hr: front ? [pol(hip, t - 90, 5.5), pol(hip, t + 90, 5.5)] : [hip, hip],
    };
  }

  function mirror(pt, o, t) {
    // reflect pt across line through o with direction angle t
    const ux = Math.cos(t * D2R), uy = Math.sin(t * D2R);
    const vx = pt[0] - o[0], vy = pt[1] - o[1];
    const d = vx * ux + vy * uy;
    const px = o[0] + ux * d, py = o[1] + uy * d;
    return [2 * px - pt[0], 2 * py - pt[1]];
  }

  // resolve a limb to {end, s, ft}
  function limb(p, f, arm, n, other) {
    const root = arm ? f.sr[n - 1] : f.hr[n - 1];
    const l1 = arm ? L.ua : L.th, l2 = arm ? L.fa : L.sh;
    const P = arm ? 'h' : 'f', A = arm ? 'a' : 'l', S = arm ? 'e' : 'k';
    const both = p[S + 'b'];
    let s = p[S + n];
    if (s == null) {
      if (both != null) s = f.front && n === 2 ? -both : both;
      else s = arm ? (f.front ? (n === 1 ? 1 : -1) : -1) : (f.front ? (n === 1 ? 1 : -1) : 1);
    }
    const ft = p['ft' + n] ?? (n === 2 ? p.ft1 : 0) ?? 0;
    let end = null;
    if (p[A + n]) {
      const a = p[A + n];
      const mid = pol(root, a[0], l1);
      end = pol(mid, a[1], l2);
      const ux = end[0] - root[0], uy = end[1] - root[1];
      const cr = (mid[0] - root[0]) * -uy + (mid[1] - root[1]) * ux;
      s = Math.abs(cr) < 0.01 ? s : (cr > 0 ? 1 : -1);
    } else if (p[P + n]) end = p[P + n];
    else if (p[P + n + 'r']) end = add(arm ? f.sh : f.hip, p[P + n + 'r']);
    else if (p[P + n + 'hd']) end = add(f.head, p[P + n + 'hd']);
    else if (n === 2 && other) {
      if (f.front) { end = mirror(other.end, f.hip, f.t); s = -other.s; }
      else { end = [other.end[0] - 2.5, other.end[1]]; s = other.s; }
    } else {
      end = arm ? (f.front ? [root[0] + (n === 1 ? 3 : -3), root[1] - 34] : [root[0] - 1, root[1] - 34.5])
                : [root[0] + (f.front ? (n === 1 ? 1 : -1) : 1), root[1] - 49];
    }
    return { end, s, ft };
  }

  const cache = new WeakMap();
  function resolve(p) {
    if (cache.has(p)) return cache.get(p);
    const f = frame(p);
    const a1 = limb(p, f, true, 1), l1 = limb(p, f, false, 1);
    const r = { f, a: [a1, limb(p, f, true, 2, a1)], l: [l1, limb(p, f, false, 2, l1)] };
    cache.set(p, r);
    return r;
  }

  function build(p, rA, rB, k) {
    // p: blended base spec, rA/rB resolved limbs to blend
    const f = frame(p);
    const mk = (arm, i) => {
      const A = arm ? rA.a[i] : rA.l[i], B = arm ? rB.a[i] : rB.l[i];
      const root = arm ? f.sr[i] : f.hr[i];
      const end = lerp2(A.end, B.end, k);
      const s = k < 0.5 ? A.s : B.s;
      const [mid, e] = ik(root, end, arm ? L.ua : L.th, arm ? L.fa : L.sh, s);
      return { root, mid, end: e, ft: lerp(A.ft, B.ft, k) };
    };
    return { f, arms: [mk(true, 0), mk(true, 1)], legs: [mk(false, 0), mk(false, 1)], view: p.view };
  }

  function solveBlend(A, B, k) {
    const p = {
      view: A.view, hip: lerp2(A.hip, B.hip, k),
      tor: lerp(A.tor ?? 90, B.tor ?? 90, k), hd: lerp(A.hd || 0, B.hd || 0, k),
    };
    return build(p, resolve(A), resolve(B), k);
  }

  /* ---------------- drawing ---------------- */
  const X = (pt) => pt[0].toFixed(1);
  const Y = (pt) => (FLOOR - pt[1]).toFixed(1);
  const xy = (pt) => X(pt) + ',' + Y(pt);
  const line = (a, b, cls, w) => `<line x1="${X(a)}" y1="${Y(a)}" x2="${X(b)}" y2="${Y(b)}" class="${cls}" stroke-width="${w}"/>`;
  const poly = (pts, cls, w) => `<polyline points="${pts.map(xy).join(' ')}" class="${cls}" stroke-width="${w}"/>`;
  const circ = (c, r, cls) => `<circle cx="${X(c)}" cy="${Y(c)}" r="${r}" class="${cls}"/>`;

  function drawLeg(lg, front, n) {
    let s = poly([lg.root, lg.mid, lg.end], 'fp', 10);
    const shin = angOf(lg.mid, lg.end);
    let fd = front ? shin + (n === 0 ? 90 : -90) : shin + 90 + lg.ft;
    const toe = pol(lg.end, fd, front ? 4 : 7.5);
    const heel = pol(lg.end, fd + 180, front ? 1 : 1.5);
    s += line(heel, toe, 'fsh', 5.5);
    return s;
  }
  function drawArm(am) {
    const sleeveEnd = lerp2(am.root, am.mid, 0.62);
    return poly([am.root, am.mid, am.end], 'fk', 6.2) + line(am.root, sleeveEnd, 'fs', 9) + circ(am.end, 3, 'fk-f');
  }
  function drawHead(f, front) {
    const { head, sh, neck } = f;
    let s = line(sh, neck, 'fk', 6);
    if (front) {
      s += circ(head, L.head, 'fk-f');
      const r = L.head + 0.3, a0 = pol(head, f.hd + 62, r), a1 = pol(head, f.hd - 62, r), up = pol(head, f.hd, 5.6);
      s += `<path d="M${xy(a0)} A${r} ${r} 0 0 1 ${xy(a1)} Q${xy(up)} ${xy(a0)}Z" class="fh-f"/>`;
    } else {
      const face = f.hd - 90;
      const hc = add(head, add(pol([0, 0], face + 180, 1.4), pol([0, 0], f.hd, 1.1)));
      s += circ(hc, L.head + 0.4, 'fh-f');
      s += circ(head, L.head - 0.3, 'fk-f');
      s += circ(pol(head, face + 10, L.head - 0.6), 1.5, 'fk-f');
      // short hair cap on the back/top of the head
      const a0 = pol(head, f.hd + 35, L.head), a1 = pol(head, face + 200, L.head);
      s += `<path d="M${xy(a0)} A${L.head} ${L.head} 0 0 1 ${xy(a1)} Q${xy(pol(head, f.hd + 120, 2))} ${xy(a0)}Z" class="fh-f"/>`;
      s += circ(pol(head, face + 175, 1.2), 1.6, 'fk-f ear');
    }
    return s;
  }
  function drawTorso(f) {
    if (f.front) {
      const [s1, s2] = f.sr, [h1, h2] = f.hr;
      const w1 = pol(f.hip, f.t, 7), w1a = pol(w1, f.t - 90, 7.2), w1b = pol(w1, f.t + 90, 7.2);
      return `<polygon points="${[s1, s2, w1b, w1a].map(xy).join(' ')}" class="fs fs-f" stroke-width="7"/>` +
        `<polygon points="${[w1a, w1b, h2, h1].map(xy).join(' ')}" class="fp fp-f" stroke-width="8"/>`;
    }
    const waist = pol(f.hip, f.t, 6);
    return line(f.hip, waist, 'fp', 13) + line(waist, f.sh, 'fs', 15);
  }

  function propPt(sol, ref) {
    if (Array.isArray(ref)) return ref;
    if (ref === 'h1') return sol.arms[0].end;
    if (ref === 'h2') return sol.arms[1].end;
    if (ref === 'f1') return sol.legs[0].end;
    if (ref === 'f2') return sol.legs[1].end;
    if (ref === 'hands') return lerp2(sol.arms[0].end, sol.arms[1].end, 0.5);
    if (ref === 'sh') return sol.f.sh;
    if (ref === 'hip') return sol.f.hip;
    return [0, 0];
  }
  function rect(x, y0, x1, y1, cls, rx = 1.5) {
    const top = Math.max(y0, y1), bot = Math.min(y0, y1);
    return `<rect x="${Math.min(x, x1).toFixed(1)}" y="${(FLOOR - top).toFixed(1)}" width="${Math.abs(x1 - x).toFixed(1)}" height="${(top - bot).toFixed(1)}" rx="${rx}" class="${cls}"/>`;
  }
  function drawProp(pr, sol, layer) {
    const [type, ...a] = pr;
    const back = ['box', 'wall', 'col', 'seat', 'back', 'tread', 'mat', 'pbars', 'post', 'bar'];
    const isBack = back.includes(type);
    if ((layer === 'back') !== isBack) return '';
    switch (type) {
      case 'mat': return rect(a[0] ?? 25, 0, a[1] ?? 175, 1.6, 'pr2', 1);
      case 'box': { // x, top, width
        const [x, top, w] = a;
        return rect(x + 3, 0, x + 6, top - 3, 'pr') + rect(x + w - 6, 0, x + w - 3, top - 3, 'pr') + rect(x, top - 4, x + w, top, 'pr2', 2);
      }
      case 'wall': { const [x, dir = 1] = a; return rect(x, 0, x + 7 * dir, 132, 'pr', 0); }
      case 'post': { const [x, top] = a; return rect(x - 2, 0, x + 2, top, 'pr', 1); }
      case 'col': { const [x, top] = a; return rect(x - 5, 0, x + 5, top, 'pr', 2); }
      case 'seat': { const [x, top, w] = a; return rect(x + w / 2 - 2, 0, x + w / 2 + 2, top - 4, 'pr') + rect(x, top - 5, x + w, top, 'pr2', 2.5); }
      case 'back': { // x, bottom, height, angle
        const [x, y, h, an = 95] = a;
        const p0 = [x, y], p1 = pol(p0, an, h);
        return line(p0, p1, 'prs2', 6);
      }
      case 'pbars': { const [x, y, w = 50] = a; return line([x - w / 2, y], [x + w / 2, y], 'prs', 4) + line([x - w / 2 + 4, y], [x - w / 2 + 4, 0], 'prs', 3) + line([x + w / 2 - 4, y], [x + w / 2 - 4, 0], 'prs', 3); }
      case 'tread': {
        return rect(30, 0, 170, 7, 'pr', 3) + rect(34, 6, 166, 9, 'pr2', 1) + line([158, 8], [168, 72], 'prs', 4) + line([160, 72], [176, 74], 'prs', 5);
      }
      case 'bar': {
        const [x, y, mode] = a;
        const mount = mode === 'down' ? line([x, y], [x, 0], 'prs', 3) + line([x - 10, 0.5], [x + 10, 0.5], 'prs', 3)
          : line([x, y], [x + 40, y], 'prs', 3) + line([x + 40, y + 6], [x + 40, 0], 'prs', 4);
        return mount + circ([x, y], 3.4, 'pr2-f');
      }
      case 'pulley': {
        const [x, y, ref] = a;
        const t = propPt(sol, ref);
        return line([x, y], t, 'cable', 1.2) + circ([x, y], 3.5, 'pr2-f');
      }
      case 'grip': { const t = propPt(sol, a[0]); return circ(t, 3.4, 'grip'); }
      case 'hbar': { const t = propPt(sol, a[0]); return line([t[0] - 6, t[1]], [t[0] + 6, t[1]], 'prs2', 3); }
      case 'roller': { const t = propPt(sol, a[0]); const o = a[1] || [0, 0]; return circ(add(t, o), 4.2, 'pr2-f'); }
      case 'plate': {
        const t = propPt(sol, a[0]); const an = a[1] ?? 40;
        return line(pol(t, an + 90, 9), pol(t, an - 90, 9), 'prs2', 4);
      }
      case 'strap': { const p1 = propPt(sol, a[0]), p2 = propPt(sol, a[1]); return line(p1, p2, 'cable', 1.6); }
      case 'rope': {
        const h1 = sol.arms[0].end, h2 = sol.arms[1].end;
        const low = Math.min(sol.legs[0].end[1], sol.legs[1].end[1]) - 3;
        const up = a[0] === 'up';
        const cy = up ? Math.max(h1[1], h2[1]) + 45 : low - 1;
        return `<path d="M${xy(h1)} Q${(h1[0] + h2[0]) / 2 + (up ? 0 : 10)},${FLOOR - cy} ${xy(h2)}" class="cable" stroke-width="1.6" fill="none"/>`;
      }
      case 'ball': { const t = propPt(sol, a[0]); return circ(t, a[1] || 6, 'pr2-f'); }
      default: return '';
    }
  }

  function render(sol, props = []) {
    const f = sol.f, front = f.front;
    let s = props.map((p) => drawProp(p, sol, 'back')).join('');
    s += `<line x1="4" y1="${FLOOR + 1.5}" x2="196" y2="${FLOOR + 1.5}" class="floor"/>`;
    if (front) {
      s += drawLeg(sol.legs[1], true, 1) + drawLeg(sol.legs[0], true, 0);
      s += drawTorso(f);
      s += drawHead(f, true);
      s += drawArm(sol.arms[1]) + drawArm(sol.arms[0]);
    } else {
      s += `<g class="far">${drawLeg(sol.legs[1], false, 1)}${drawArm(sol.arms[1])}</g>`;
      s += drawTorso(f);
      s += drawLeg(sol.legs[0], false, 0);
      s += drawHead(f, false);
      s += drawArm(sol.arms[0]);
    }
    s += props.map((p) => drawProp(p, sol, 'front')).join('');
    return s;
  }

  const ease = (k) => 0.5 - 0.5 * Math.cos(Math.PI * k);

  function frameAt(fig, ms) {
    const keys = fig.k;
    if (keys.length === 1) return solveBlend(keys[0], keys[0], 0);
    const seq = fig.loop ? keys.map((_, i) => i) : [...keys.map((_, i) => i), ...keys.slice(1, -1).map((_, i) => keys.length - 2 - i)];
    const seg = fig.ms || 1000, hold = fig.hold ?? 280;
    const per = seg + hold;
    const total = per * seq.length;
    const t = ((ms % total) + total) % total;
    const i = Math.floor(t / per);
    const local = t - i * per;
    const k = local < hold ? 0 : ease((local - hold) / seg);
    const a = keys[seq[i]], b = keys[seq[(i + 1) % seq.length]];
    return solveBlend(a, b, k);
  }

  function svg(fig, opts = {}) {
    const idx = opts.key ?? (fig.thumb ?? (fig.k.length > 1 ? 1 : 0));
    const sol = solveBlend(fig.k[idx], fig.k[idx], 0);
    const vb = fig.vb || '0 0 200 132';
    return `<svg class="fig" viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${opts.label || 'exercise illustration'}">${render(sol, fig.props)}</svg>`;
  }

  /* animation registry */
  const live = new Set();
  let running = false, last = 0;
  function loop(now) {
    if (!live.size) { running = false; return; }
    if (now - last > 33) {
      last = now;
      for (const it of live) {
        if (!it.el.isConnected) { live.delete(it); continue; }
        if (it.paused) continue;
        const sol = frameAt(it.fig, Math.max(0, now - it.t0) * (it.speed || 1));
        it.g.innerHTML = render(sol, it.fig.props);
      }
    }
    requestAnimationFrame(loop);
  }
  function animate(el, fig, opts = {}) {
    if (!fig) return;
    const vb = fig.vb || '0 0 200 132';
    el.innerHTML = `<svg class="fig" viewBox="${vb}" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="${opts.label || 'animated exercise illustration'}"><g></g></svg>`;
    const g = el.querySelector('g');
    const reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (reduce || fig.k.length === 1) { g.innerHTML = render(solveBlend(fig.k[fig.thumb ?? (fig.k.length > 1 ? 1 : 0)], fig.k[fig.thumb ?? (fig.k.length > 1 ? 1 : 0)], 0), fig.props); return; }
    const it = { el, fig, g, t0: performance.now(), speed: opts.speed };
    g.innerHTML = render(frameAt(fig, 0), fig.props);
    live.add(it);
    if (!running) { running = true; requestAnimationFrame(loop); }
    return it;
  }

  /* --------- pose builders used by the exercise library --------- */
  const B = {
    // standing (side)
    st: (o = {}) => ({ hip: [100, 52], tor: 90, f1: [101.5, 3], f2: [98.5, 3], ...o }),
    // straight body line from feet at (fx,fy) rising at deg
    line: (fx, fy, deg, o = {}) => ({ hip: pol([fx, fy], deg, 50), tor: deg, f1: [fx, fy], f2: [fx - 2.5, fy], ...o }),
    // shoulder of a straight body line
    lineSh: (fx, fy, deg) => pol([fx, fy], deg, 82),
    // kneeling straight body line from knee at (kx,3)
    kneel: (kx, deg, o = {}) => ({ hip: pol([kx, 3], deg, 25), tor: deg, l1: [deg + 180, 168], l2: [deg + 180, 168], ...o }),
    kneelSh: (kx, deg) => pol([kx, 3], deg, 57),
    // supine (face up), head to the left
    sup: (o = {}) => ({ hip: [112, 7], tor: 180, f1: [161, 4], f2: [159, 4], h1: [104, 2.5], h2: [102, 2.5], e1: 1, e2: 1, ...o }),
    // prone (face down), head to the right
    pro: (o = {}) => ({ hip: [88, 7.5], tor: 0, f1: [38.5, 4], f2: [41, 4], h1: [104, 3], h2: [102, 3], e1: 1, e2: 1, ...o }),
    // all fours
    quad: (o = {}) => ({ hip: [80, 28], tor: 16.3, f1: [55, 3], f2: [57, 3], h1: [111, 2], h2: [108.5, 2], ...o }),
    // seated on floor
    sit: (o = {}) => ({ hip: [80, 8], tor: 90, f1: [130, 4], f2: [128, 4], ...o }),
    // seated on bench/seat, top at y=27
    bench: (o = {}) => ({ hip: [88, 31], tor: 92, f1: [116, 4], f2: [113, 4], ...o }),
    // front view standing
    fr: (o = {}) => ({ view: 'front', hip: [100, 52], tor: 90, f1: [107, 3], h1: [113, 51], ...o }),
    pol,
  };

  return { svg, animate, frameAt, B, live, render, solveBlend };
})();

/* ---- exercises.js ---- */
/* ============================================================
   Exercise library. cap = capacity benchmark used to personalise
   targets (push = max push-ups, pull = max pull-ups, core = max
   crunches, hold = max plank seconds, legs = max squats,
   cardio = minutes of continuous jogging, mob = mobility,
   machine = weight-stack exercises). r = ratio to benchmark.
   ============================================================ */
const EX = (() => {
  const { st, line, lineSh, kneel, kneelSh, sup, pro, quad, sit, bench, fr } = Fig.B;
  const list = [];
  const E = (o) => { list.push(Object.assign({ eq: 'none', u: 'reps', d: 2, side: false, tempo: 3, min: 5, max: 60, r: 1, tags: [], easy: null, hard: null }, o)); };

  /* ---------- pose helpers ---------- */
  const hands = (x, y = 2) => ({ h1: [x, y], h2: [x - 2.5, y] });
  function pushFig(fx, up, down, dx = 0, extra = {}) {
    const s = lineSh(fx, 3, up);
    const h = hands(s[0] + dx);
    return { k: [line(fx, 3, up, { ...h, ...extra }), line(fx, 3, down, { ...h, ...extra })], props: [['mat']] };
  }
  const plankHigh = line(45, 3, 24, hands(120));
  const plankLow = line(45, 3, 12, { a1: [-90, 0], a2: [-90, 0] });
  const squatPose = { hip: [80, 30], tor: 52, hd: 30, f1: [101.5, 3], f2: [98.5, 3], h1r: [33, 0], h2r: [31, 0] };
  const standArmsFwd = st({ h1r: [33, -2], h2r: [31, -2] });
  const crunchHands = { h1hd: [3, 6], h2hd: [1, 6], e1: -1, e2: -1 };
  const hang = { hip: [99, 58], tor: 91, h1: [102, 124], h2: [100, 124], l1: [-100, -140], l2: [-98, -142] };
  const run = (a, tread) => {
    const A = { hip: [100, tread ? 60 : 56], tor: 80, hd: 10, l1: [-60, -100], l2: [-115, -165], a1: [-125, -35], a2: [-60, 30] };
    const B = { hip: [100, tread ? 60 : 56], tor: 80, hd: 10, l2: [-60, -100], l1: [-115, -165], a2: [-125, -35], a1: [-60, 30] };
    if (a) { A.hip[1] += 2; B.hip[1] += 2; }
    return { k: [A, B], props: tread ? [['tread']] : [], ms: 380, hold: 40 };
  };
  const walk = (tread, incline) => {
    const y = tread ? 59 : 54;
    const A = { hip: [100, y], tor: incline ? 84 : 88, hd: 4, l1: [-72, -96], l2: [-108, -112], a1: [-110, -90], a2: [-70, -60] };
    const B = { hip: [100, y], tor: incline ? 84 : 88, hd: 4, l2: [-72, -96], l1: [-108, -112], a2: [-110, -90], a1: [-70, -60] };
    return { k: [A, B], props: tread ? [['tread']] : [], ms: 560, hold: 60 };
  };
  const seat = [['seat', 70, 27, 36]];

  /* ================= CHEST ================= */
  E({ id: 'pushup', n: 'Push-Up', g: 'Chest', m: 'Chest, triceps, front shoulders, core', d: 2, cap: 'push', r: 1, min: 3, tags: ['push'], easy: 'knee_pushup', hard: 'decline_pushup',
    steps: ['Start in a high plank: hands slightly wider than shoulders, fingers forward, body in a straight line from head to heels.', 'Brace your abs and squeeze your glutes so your hips stay level.', 'Bend your elbows to about 45° from your body and lower until your chest is a fist-height from the floor.', 'Press the floor away to straighten your arms, keeping the body rigid like a plank.'],
    tips: ['Think "screw your hands into the floor" to engage the shoulders.', 'Keep your neck neutral: look slightly ahead of your hands.', 'Quality first: stop the set 1–2 reps before your form breaks.'],

  const DOW = ['Sun', 'Mon', 'Tue', 'Wed', 'Thu', 'Fri', 'Sat'];
  const DOWL = ['Sunday', 'Monday', 'Tuesday', 'Wednesday', 'Thursday', 'Friday', 'Saturday'];
  const MON = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  const MONL = ['January', 'February', 'March', 'April', 'May', 'June', 'July', 'August', 'September', 'October', 'November', 'December'];
  const fmtDate = (s, long) => { const d = parse(s); return long ? `${DOWL[d.getDay()]}, ${MONL[d.getMonth()]} ${d.getDate()}` : `${DOW[d.getDay()]} ${MON[d.getMonth()]} ${d.getDate()}`; };
  const fmtTime = (t, h24) => { if (!t) return ''; if (h24) return t; let [h, m] = t.split(':').map(Number); const ap = h >= 12 ? 'pm' : 'am'; h = h % 12 || 12; return `${h}:${pad(m)}${ap}`; };

  const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 7);

  const interp = (arr, L) => { L = Math.max(0, Math.min(arr.length - 1, L)); const i = Math.floor(L); const f = L - i; return i >= arr.length - 1 ? arr[arr.length - 1] : arr[i] + (arr[i + 1] - arr[i]) * f; };

const chartData = new Map();

function lineChart(series, o = {}) {
  series = (series || []).filter((s) => s && s.pts && s.pts.length);
  const id = 'ch' + (++chartSeq);
  const W = chartW(), H = o.h || 220, L = 40, R = 12, T = 12, B = 24;
  const all = series.flatMap((s) => s.pts);
  if (!all.length) return `<div class="empty">${ic('chart')}<div>No data yet</div></div>`;
  const xs = all.map((p) => E_.parse(p.x).getTime());
  let x0 = Math.min(...xs), x1 = Math.max(...xs);
  if (o.from) x0 = Math.min(x0, E_.parse(o.from).getTime());
  if (x1 - x0 < 86400000 * 6) { x0 -= 86400000 * 3; x1 += 86400000 * 3; }
  const ys = all.map((p) => p.y).concat((o.refs || []).map((r) => r.y));
  const nr = niceRange(Math.min(...ys), Math.max(...ys));
  const sx = (t) => L + (t - x0) / (x1 - x0) * (W - L - R);
  const sy = (v) => T + (1 - (v - nr.lo) / (nr.hi - nr.lo)) * (H - T - B);

  g += `<g class="axis">${nr.ticks.map((t) => `<text x="${L - 6}" y="${sy(t) + 4}" text-anchor="end">${fmtN(t, 1)}</text>`).join('')}`;

  g += '</g>';
  (o.refs || []).forEach((r) => { g += `<line class="ref" x1="${L}" x2="${W - R}" y1="${sy(r.y)}" y2="${sy(r.y)}"/><text class="reftxt" x="${W - R}" y="${sy(r.y) - 4}" text-anchor="end">${esc(r.label)}</text>`; });
  series.forEach((s) => {
    const pts = [...s.pts].sort((a, b) => a.x.localeCompare(b.x));
    const d = pts.map((p, i) => `${i ? 'L' : 'M'}${sx(E_.parse(p.x).getTime()).toFixed(1)},${sy(p.y).toFixed(1)}`).join('');

    if (pts.length <= 40) g += pts.map((p) => `<circle cx="${sx(E_.parse(p.x).getTime())}" cy="${sy(p.y)}" r="3.5" fill="${s.color}" stroke="var(--surface)" stroke-width="2"/>`).join('');

  });

}

  return `<div class="chart" data-chart="${id}"><svg viewBox="0 0 ${W} ${H}" role="img" aria-label="${esc(o.label || 'bar chart')}">${g}</svg><div class="tip"></div></div>`;

function bindCharts(root) {

    const d = chartData.get(c.dataset.chart); if (!d) return;
    const svg = $('svg', c), tip = $('.tip', c);
    const toLocal = (ev) => { const r = svg.getBoundingClientRect(); return { x: (ev.clientX - r.left) / r.width * d.W, scale: r.width / d.W, r }; };
    const hide = () => { tip.classList.remove('on'); const xh = $('.xh', svg); if (xh) xh.style.display = 'none'; const hl = $('.hl', svg); if (hl) hl.innerHTML = ''; };

        tip.style.left = ((d.L + d.bw * i + d.bw / 2) * scale) + 'px'; tip.style.top = '20px'; tip.classList.add('on');
        return;
      }
      const t = d.x0 + (x - d.L) / (d.W - d.L - d.R) * (d.x1 - d.x0);
      let best = null;
      d.series.forEach((s) => s.pts.forEach((p) => { const pt = E_.parse(p.x).getTime(); const dd = Math.abs(pt - t); if (!best || dd < best.dd) best = { dd, x: p.x, t: pt }; }));

      const xh = $('.xh', svg); xh.setAttribute('x1', X); xh.setAttribute('x2', X); xh.style.display = '';
      $('.hl', svg).innerHTML = rows.map((r) => `<circle cx="${X}" cy="${d.sy(r.p.y)}" r="5" fill="${r.s.color}" stroke="var(--surface)" stroke-width="2"/>`).join('');
      tip.innerHTML = `<b>${E_.fmtDate(best.x)}</b><br>${rows.map((r) => `${d.series.length > 1 ? esc(r.s.name) + ': ' : ''}${d.fmt(r.p.y)}`).join('<br>')}`;
      tip.style.left = Math.max(60, Math.min(svg.getBoundingClientRect().width - 60, X * scale)) + 'px';
      tip.style.top = (Math.min(...rows.map((r) => d.sy(r.p.y))) * scale) + 'px';

function applyTemplate(id, replace) {
  const t = CONTENT.PLAN_TEMPLATES.find((x) => x.id === id); if (!t) return;
  if (replace) st.schedule.recurring = [];
  t.items.forEach((it) => st.schedule.recurring.push({ id: E_.uid(), ...JSON.parse(JSON.stringify(it)), from: E_.today() }));
  const nWork = t.items.filter((i) => i.kind !== 'stretch').reduce((a, i) => a + i.days.length, 0);
  st.goals.workouts = nWork;
  st.goals.cardioMin = t.items.filter((i) => i.kind === 'cardio').reduce((a, i) => a + i.days.length * i.dur, 0) || st.goals.cardioMin;
  st.goals.activeMin = Math.max(150, t.items.reduce((a, i) => a + i.days.length * i.dur, 0));
  st.goals.strength = t.items.filter((i) => i.kind === 'strength' || i.kind === 'hiit').reduce((a, i) => a + i.days.length, 0);
  st.goals.stretch = Math.max(2, t.items.filter((i) => i.kind === 'stretch').reduce((a, i) => a + i.days.length, 0));

}

/* ---------------- shared bits ---------------- */
const STATUS = {
  done: { cls: 'good', label: 'Done', ic: 'check' }, missed: { cls: 'bad', label: 'Missed', ic: 'x' },
  skipped: { cls: '', label: 'Skipped', ic: 'skip' }, due: { cls: 'warn', label: 'Due now', ic: 'clock' }, planned: { cls: 'acc', label: 'Planned', ic: 'cal' },
};
function planMeta(p) {
  const bits = [];
  if (p.time) bits.push(tm(p.time));
  if (p.dur) bits.push(`${p.dur} min`);
  if (p.routineId) { const r = findRoutine(p.routineId); if (r) bits.push(esc(r.name)); }
  else if (p.focus) { const f = CONTENT.FOCUS.find((x) => x.id === p.focus); if (f) bits.push(esc(f.label.split(' (')[0])); }
  if (p.rec) bits.push(`${ic('repeat', 'sm')}`);
  return bits.join(' · ');
}
function planRow(x) {
  const p = x.plan, S = STATUS[x.status];
  const icCls = x.status === 'done' ? 'done' : x.status === 'missed' ? 'missed' : '';
  const actions = x.status === 'done'
    ? `<button class="btn sm" data-a="viewSession" data-id="${x.session.id}">View</button>`
    : `<button class="btn sm pri" data-a="startPlan" data-ref="${p.ref}" data-d="${p.date}" aria-label="Start ${esc(p.title)}">${ic('play', 'sm')}<span class="hide-xs">Start</span></button>`;
  return `<div class="plan-row"><div class="plan-ic ${icCls}">${ic(kindIc(p.kind))}</div>
    <div class="grow"><div class="ttl ell" style="font-weight:650">${esc(p.title || kindLabel(p.kind))}</div><div class="small muted"><span class="tag ${S.cls}" style="margin-right:4px">${ic(S.ic, 'sm')}${S.label}</span>${planMeta(p)}</div></div>
    ${actions}
    <button class="btn icon sm" data-a="planMenu" data-ref="${p.ref}" data-d="${p.date}" aria-label="More options">${ic('dots')}</button></div>`;
}
function sessionRow(s) {
  return `<div class="plan-row"><div class="plan-ic done">${ic(kindIc(s.kind))}</div><div class="grow"><div class="ttl ell" style="font-weight:650">${esc(s.name)}</div>
    <div class="small muted"><span class="tag good" style="margin-right:4px">${ic('check', 'sm')}Done</span>${s.time ? tm(s.time) + ' · ' : ''}${s.dur || 0} min${s.kcal ? ` · ${s.kcal} kcal` : ''}</div></div>
    <button class="btn sm" data-a="viewSession" data-id="${s.id}">View</button></div>`;

function prompts(t, hr) {
  const out = [];
  const card = (iconN, title, text, btns, cls = '') => `<div class="card prompt ${cls}" style="margin-top:10px"><div class="row top"><div class="plan-ic">${ic(iconN)}</div><div class="grow"><div style="font-weight:700">${title}</div>${text ? `<div class="small t2">${text}</div>` : ''}<div class="btns" style="margin-top:10px">${btns}</div></div></div></div>`;
  if (st.active) {
    const a = st.active, done = a.steps ? a.steps.filter((s) => s.done).length : a.si, tot = a.steps ? a.steps.length : a.segs.length;
    out.push(card('play', 'Workout in progress', `${esc(a.name)} · ${done}/${tot} ${a.steps ? 'sets' : 'intervals'} done`, '<button class="btn sm pri" data-a="resumeWorkout">Resume</button><button class="btn sm" data-a="finishWorkout">Finish & save</button>'));
  }

  const y = E_.addDays(t, -1);
  const checks = [];

  E_.dayStatus(st, t).plans.filter((x) => x.status === 'due' && x.plan.time && minsSince(x.plan.time) > (x.plan.dur || 30)).forEach((x) => checks.push(x));
  checks.slice(0, 2).forEach((x) => {
    const p = x.plan;
    out.push(card('cal', `Did you do “${esc(p.title || kindLabel(p.kind))}”?`, `${p.date === t ? 'Today' : 'Yesterday'}${p.time ? ' at ' + tm(p.time) : ''}`,

  });

  const fh = st.settings.foodPromptHour ?? 18;
  if (!st.food.log[t] && hr >= fh) out.push(foodPromptCard(t, 'Did you meet your eating goals today?'));
  else if (!st.food.log[y] && y >= st.created && hr < fh) out.push(foodPromptCard(y, 'How did eating go yesterday?'));
  // reminders
  const recentW = st.weights.some((w) => w.date >= E_.addDays(t, -4));
  if (st.goals.weighIns > 0 && !recentW && st.weights.length) out.push(card('scale', 'Time for a weigh-in', 'Same time of day gives the most accurate trend.', '<button class="btn sm pri" data-a="addWeight">Log weight</button>'));
  const recentBp = st.bp.some((w) => w.date >= E_.addDays(t, -4));
  if (st.goals.bpChecks > 0 && !recentBp) out.push(card('heart', st.bp.length ? 'Check your blood pressure' : 'Log your first blood pressure reading', 'Sit quietly for 5 minutes first, arm at heart level.', '<button class="btn sm pri" data-a="addBp">Log reading</button>'));
  const lb = st.settings.lastBackup;
  if (st.sessions.length >= 5 && (!lb || E_.daysBetween(lb, t) > 21)) out.push(card('download', 'Back up your progress', 'Your data lives only on this device. Save a backup file now and then.', '<button class="btn sm" data-a="exportData">Export backup</button><button class="btn sm ghost" data-a="snoozeBackup">Later</button>'));
  const bd = st.profile.baselineDate;
  if (st.sessions.length >= 8 && (!bd || E_.daysBetween(bd, t) > 42) && !st.flags['retest' + t.slice(0, 7)]) out.push(card('target', 'Time to retest your fitness?', 'A quick test keeps your targets accurate as you get stronger.', '<button class="btn sm pri" data-a="fitTest">Take the test</button><button class="btn sm ghost" data-a="snoozeRetest">Not now</button>'));
  return out.slice(0, 4);
}

ACT.exportIcs = () => {

  const add = (uidv, title, start, dur, rrule, desc) => {
    lines.push('BEGIN:VEVENT', `UID:${uidv}@workout-tracker`, `DTSTAMP:${stamp}`, `DTSTART:${start}`, `DURATION:PT${dur || 30}M`, `SUMMARY:${title.replace(/[,;]/g, ' ')}`);

    const tgt = R.format === 'circuit' && !it.warm && !it.cool ? `${it.v}s × ${it.sets} rounds` : `${it.sets > 1 ? it.sets + ' × ' : ''}${targetText(e, it.v, it.w)}`;

ACT.pvSwap = (el) => {
  const it = ui.preview.r.items[+el.dataset.i];
  const opts = E_.swapOptions(st, it.ex);
  if (!opts.length) { toast('No alternatives available'); return; }
  const used = new Set(ui.preview.r.items.map((x) => x.ex));
  const pick = opts.find((x) => !used.has(x.id)) || opts[0];
  // rotate through options
  const cand = opts.filter((x) => !used.has(x.id));
  const nx = cand.length ? cand[Math.floor(Math.random() * Math.min(4, cand.length))] : pick;
  const tg = E_.target(st, nx, ui.preview.o.feel || 3);

/* ----- weight ----- */
function weightView() {
  const ws = [...st.weights].sort((a, b) => a.date.localeCompare(b.date));
  const last = ws.at(-1), first = ws[0];
  const t = E_.today();
  const ago = (n) => ws.filter((w) => w.date <= E_.addDays(t, -n)).at(-1);
  const w7 = ago(7), w30 = ago(30);
  const kg = last ? last.kg : st.profile.weightKg;
  const b = E_.bmi(st.profile, kg);
  const bcat = !b ? '' : b < 18.5 ? 'Underweight' : b < 25 ? 'Healthy' : b < 30 ? 'Overweight' : 'Obese';
  const goal = st.profile.goalWeightKg;
  const delta = (a) => (a && last ? `${last.kg - a.kg >= 0 ? '+' : '−'}${E_.wDisp(st, Math.abs(last.kg - a.kg))}` : '–');
  // 7-day moving average series
  const pts = ws.filter((w) => inRange(w.date)).map((w) => ({ x: w.date, y: +E_.wDisp(st, w.kg) }));
  const avg = pts.map((p, i) => { const win = ws.filter((w) => w.date <= p.x && w.date > E_.addDays(p.x, -7)); return { x: p.x, y: +E_.wDisp(st, win.reduce((a, w) => a + w.kg, 0) / win.length) }; });
  const ideal = st.profile.heightCm ? [18.5, 24.9].map((x) => x * (st.profile.heightCm / 100) ** 2) : null;
  return `<div class="card stack"><div class="card-h" style="margin:0"><h2>Log weight</h2></div>
    <div class="g2"><label class="field"><span>Weight (${E_.wUnit(st)})</span><input type="number" inputmode="decimal" step="0.1" name="wv" placeholder="${last ? E_.wDisp(st, last.kg) : ''}"></label><label class="field"><span>Date</span><input type="date" name="wd" value="${t}"></label></div><button class="btn pri" data-a="saveWeightInline">Save weight</button></div>
  <div class="g3" style="margin-top:12px"><div class="kpi"><span>Current</span><b class="num">${kg ? E_.wDisp(st, kg) : '–'}</b><span>${E_.wUnit(st)}</span></div><div class="kpi"><span>7 days</span><b class="num">${delta(w7)}</b><span>${E_.wUnit(st)}</span></div><div class="kpi"><span>30 days</span><b class="num">${delta(w30)}</b><span>${E_.wUnit(st)}</span></div></div>
  <div class="g2" style="margin-top:10px"><div class="kpi"><span>BMI</span><b class="num">${b ? round1(b) : '–'}</b><span>${bcat}${ideal ? ` · healthy ${E_.wDisp(st, ideal[0], 0)}–${E_.wDisp(st, ideal[1], 0)} ${E_.wUnit(st)}` : ''}</span></div>
    <div class="kpi"><span>Goal</span><b class="num">${goal ? E_.wDisp(st, goal) + ' ' + E_.wUnit(st) : '–'}</b><span>${goal && last ? `${E_.wDisp(st, Math.abs(last.kg - goal))} ${E_.wUnit(st)} to go` : '<button class="btn xs" data-a="settings">Set goal</button>'}</span></div></div>
  <div class="card" style="margin-top:12px"><div class="card-h"><h2>Trend</h2></div>${rangeChips()}
    ${pts.length ? lineChart(pts.length > 6 ? [{ name: 'Weight', color: 'var(--series-1)', pts }, { name: '7-day avg', color: 'var(--series-2)', pts: avg }] : [{ name: 'Weight', color: 'var(--series-1)', pts }], { label: 'Weight over time', refs: goal ? [{ y: +E_.wDisp(st, goal), label: 'Goal' }] : [], fmt: (v) => `${fmtN(v, 1)} ${E_.wUnit(st)}` }) : `<div class="empty">${ic('scale')}<div>Log a few weigh-ins to see your trend.</div></div>`}
    ${first && last && first !== last ? `<div class="small muted" style="margin-top:6px">Since ${E_.fmtDate(first.date)}: ${delta(first)} ${E_.wUnit(st)}</div>` : ''}</div>
  <div class="sec-h"><h2>Entries</h2></div>
  <div class="card list">${ws.length ? ws.slice().reverse().slice(0, 40).map((w) => `<div class="li"><span class="grow">${E_.fmtDate(w.date)}</span><b class="num">${E_.wDisp(st, w.kg)} ${E_.wUnit(st)}</b><button class="btn icon sm" data-a="delWeight" data-id="${w.id}" aria-label="Delete entry">${ic('trash', 'sm')}</button></div>`).join('') : '<div class="muted small">No entries yet.</div>'}</div>`;
}
function addWeightEntry(v, d) {
  const kg = E_.wIn(st, v);
  if (!kg || kg < 20 || kg > 400) { toast('Enter a valid weight'); return false; }
  st.weights = st.weights.filter((w) => w.date !== d);
  st.weights.push({ id: E_.uid(), date: d, kg });
  st.profile.weightKg = E_.curWeight(st);
  save(); return true;
}
ACT.saveWeightInline = () => { if (addWeightEntry(val('[name=wv]', $('#main')), val('[name=wd]', $('#main')) || E_.today())) { render(); toast('Weight saved'); } };
ACT.delWeight = async (el) => { if (!(await confirmBox('Delete this weight entry?', 'Delete', true))) return; st.weights = st.weights.filter((w) => w.id !== el.dataset.id); save(); render(); };
ACT.addWeight = () => {

  sheet('Log weight', `<div class="stack"><div class="g2"><label class="field"><span>Weight (${E_.wUnit(st)})</span><input type="number" inputmode="decimal" step="0.1" name="wv" value="${last ? E_.wDisp(st, last.kg) : ''}"></label><label class="field"><span>Date</span><input type="date" name="wd" value="${E_.today()}"></label></div><p class="small muted">Tip: weigh in the morning after using the bathroom, before eating.</p></div>`,
    { foot: '<button class="btn pri" data-a="saveWeightSheet">Save</button>' });
  setTimeout(() => { const i = $('[name=wv]', topSheet()); i && i.select(); }, 60);
};
ACT.saveWeightSheet = () => { if (addWeightEntry(val('[name=wv]'), val('[name=wd]') || E_.today())) { closeSheet(); render(); toast('Weight saved'); } };

/* ----- blood pressure ----- */
function bpView() {
  const list = [...st.bp].sort((a, b) => (a.date + a.time).localeCompare(b.date + b.time));
  const last = list.at(-1);
  const cat = last && E_.bpCat(last.sys, last.dia);
  const wk = list.filter((x) => x.date >= E_.addDays(E_.today(), -7));
  const avg = wk.length ? { s: Math.round(wk.reduce((a, x) => a + x.sys, 0) / wk.length), d: Math.round(wk.reduce((a, x) => a + x.dia, 0) / wk.length) } : null;
  const ac = avg && E_.bpCat(avg.s, avg.d);
  const inR = list.filter((x) => inRange(x.date));
  return `<div class="card stack"><h2>Log a reading</h2>${bpForm('in')}<button class="btn pri" data-a="saveBpInline">Save reading</button></div>
  ${last ? `<div class="g2" style="margin-top:12px"><div class="kpi"><span>Latest · ${E_.fmtDate(last.date)}</span><b class="num">${last.sys}/${last.dia}</b><span><span class="tag ${bpTagCls(cat)}">${cat.label}</span>${last.pulse ? ` · ${last.pulse} bpm` : ''}</span></div>
    <div class="kpi"><span>7-day average</span><b class="num">${avg ? `${avg.s}/${avg.d}` : '–'}</b><span>${avg ? `<span class="tag ${bpTagCls(ac)}">${ac.label}</span> · ${plural(wk.length, 'reading')}` : 'Not enough readings'}</span></div></div>
    <div class="note ${cat.id === 'crisis' ? 'bad' : cat.id === 'stage2' || cat.id === 'stage1' ? 'warn' : ''}" style="margin-top:10px">${cat.id === 'crisis' ? ic('warn', 'sm') + ' ' : ''}${esc(cat.advice)}</div>` : ''}
  <div class="card" style="margin-top:12px"><div class="card-h"><h2>Trend</h2></div>${rangeChips()}
    ${inR.length ? lineChart([{ name: 'Systolic', color: 'var(--series-1)', pts: inR.map((x) => ({ x: x.date, y: x.sys })) }, { name: 'Diastolic', color: 'var(--series-2)', pts: inR.map((x) => ({ x: x.date, y: x.dia })) }], { label: 'Blood pressure over time', refs: [{ y: 120, label: '120' }, { y: 80, label: '80' }], fmt: (v) => `${fmtN(v)} mmHg` }) : `<div class="empty">${ic('heart')}<div>No readings in this range.</div></div>`}</div>
  <div class="card" style="margin-top:12px"><h3 style="margin-bottom:8px">Categories (adults)</h3><table class="lvl-tbl small"><tr><th>Category</th><th>Systolic</th><th></th><th>Diastolic</th></tr>
    <tr><td><span class="tag good">Normal</span></td><td>&lt;120</td><td>and</td><td>&lt;80</td></tr><tr><td><span class="tag warn">Elevated</span></td><td>120–129</td><td>and</td><td>&lt;80</td></tr>
    <tr><td><span class="tag bad">Stage 1</span></td><td>130–139</td><td>or</td><td>80–89</td></tr><tr><td><span class="tag bad">Stage 2</span></td><td>≥140</td><td>or</td><td>≥90</td></tr><tr><td><span class="tag bad">${ic('warn', 'sm')} Very high</span></td><td>&gt;180</td><td>and/or</td><td>&gt;120</td></tr></table>
    <p class="small muted" style="margin-top:8px">For information only, not a diagnosis. Take 2 readings a minute apart, seated, back supported, arm at heart level. Discuss your readings with your doctor.</p></div>
  <div class="sec-h"><h2>Readings</h2></div>
  <div class="card list">${list.length ? list.slice().reverse().slice(0, 50).map((x) => { const c = E_.bpCat(x.sys, x.dia); return `<div class="li"><div class="grow"><b class="num">${x.sys}/${x.dia}</b>${x.pulse ? ` <span class="muted small">· ${x.pulse} bpm</span>` : ''}<div class="small muted">${E_.fmtDate(x.date)} ${x.time ? tm(x.time) : ''}${x.note ? ' · ' + esc(x.note) : ''}</div></div><span class="tag ${bpTagCls(c)}">${c.label}</span><button class="btn icon sm" data-a="delBp" data-id="${x.id}" aria-label="Delete reading">${ic('trash', 'sm')}</button></div>`; }).join('') : '<div class="muted small">No readings yet.</div>'}</div>`;
}
function bpForm(p) {
  return `<div class="g3"><label class="field"><span>Systolic (top)</span><input type="number" inputmode="numeric" name="${p}sys" placeholder="120"></label><label class="field"><span>Diastolic (bottom)</span><input type="number" inputmode="numeric" name="${p}dia" placeholder="80"></label><label class="field"><span>Pulse</span><input type="number" inputmode="numeric" name="${p}pulse" placeholder="bpm"></label></div>
  <div class="g2"><label class="field"><span>Date</span><input type="date" name="${p}d" value="${E_.today()}"></label><label class="field"><span>Time</span><input type="time" name="${p}t" value="${E_.nowTime()}"></label></div>
  <label class="field"><span>Note (optional)</span><input type="text" name="${p}note" placeholder="e.g. after walk, left arm, felt stressed"></label>`;
}
function saveBp(p, root) {
  const sys = num(`[name=${p}sys]`, root), dia = num(`[name=${p}dia]`, root);
  if (!sys || !dia || sys < 60 || sys > 260 || dia < 30 || dia > 180 || dia >= sys) { toast('Check the numbers: e.g. 120 over 80'); return null; }
  const r = { id: E_.uid(), sys, dia, pulse: num(`[name=${p}pulse]`, root), date: val(`[name=${p}d]`, root) || E_.today(), time: val(`[name=${p}t]`, root), note: val(`[name=${p}note]`, root) };
  st.bp.push(r); save(); return r;
}
function bpResultToast(r) { const c = E_.bpCat(r.sys, r.dia); if (c.id === 'crisis') { sheet('Very high reading', `<div class="note bad">${ic('warn')} ${esc(c.advice)}</div>`); } else toast(`Saved · ${c.label}`); }
ACT.saveBpInline = () => { const r = saveBp('in', $('#main')); if (r) { render(); bpResultToast(r); } };
ACT.addBp = () => sheet('Blood pressure', `<div class="stack">${bpForm('s')}</div>`, { foot: '<button class="btn pri" data-a="saveBpSheet">Save</button>' });
ACT.saveBpSheet = () => { const r = saveBp('s'); if (r) { closeSheet(); render(); bpResultToast(r); } };
ACT.delBp = async (el) => { if (!(await confirmBox('Delete this reading?', 'Delete', true))) return; st.bp = st.bp.filter((x) => x.id !== el.dataset.id); save(); render(); };

/* ----- nutrition ----- */
function foodChecklist(d) {
  const log = st.food.log[d] || {};
  const active = st.food.goals.filter((g) => g.on);
  const water = log.water || 0, wg = st.food.waterGoal || 8;
  return `<div class="stack">
    <div><div class="lbl" style="margin-bottom:6px">Water (glasses)</div><div class="water">${Array.from({ length: Math.max(wg, water) }, (_, i) => `<button class="${i < water ? 'on' : ''}" data-a="foodWater" data-d="${d}" data-v="${i + 1}" aria-label="${i + 1} glasses">${ic('drop', 'sm')}</button>`).join('')}<button data-a="foodWater" data-d="${d}" data-v="${water + 1}" aria-label="Add a glass" style="border-style:dashed">${ic('plus', 'sm')}</button></div></div>
    <div>${active.length ? active.map((g) => `<button class="check ${(log.met || {})[g.id] ? 'on' : ''}" data-a="foodTog" data-d="${d}" data-id="${g.id}"><span class="box">${ic('check', 'sm')}</span><span class="grow">${esc(g.text)}</span></button>`).join('') : '<div class="muted small">No active goals. Add some below.</div>'}</div>
    <div class="field"><span>Overall, did you eat the way you wanted?</span><div class="seg">${[['yes', 'Yes'], ['partial', 'Mostly'], ['no', 'Not really']].map(([k, l]) => `<button class="${log.overall === k ? 'on' : ''}" data-a="foodOverall" data-d="${d}" data-v="${k}">${l}</button>`).join('')}</div></div>
    <label class="field"><span>Notes</span><input type="text" data-in="foodNote" data-d="${d}" value="${esc(log.note || '')}" placeholder="What went well? What was hard?"></label></div>`;
}
function ensureLog(d) { return (st.food.log[d] ||= { met: {}, water: 0 }); }
function refreshFood(d) { const sh = topSheet(); if (sh && $('#foodSheet', sh)) $('#foodSheet', sh).innerHTML = foodChecklist(d); else if (ui.tab === 'track' && ui.track === 'food') render(); else if (ui.tab === 'today') render(); }
ACT.foodWater = (el) => { const l = ensureLog(el.dataset.d); const v = +el.dataset.v; l.water = l.water === v ? v - 1 : v; save(); refreshFood(el.dataset.d); };
ACT.foodTog = (el) => { const l = ensureLog(el.dataset.d); l.met[el.dataset.id] = !l.met[el.dataset.id]; const a = st.food.goals.filter((g) => g.on); const n = a.filter((g) => l.met[g.id]).length; l.overall = n === a.length ? 'yes' : n >= a.length / 2 ? 'partial' : (n ? 'partial' : l.overall || 'no'); save(); refreshFood(el.dataset.d); };
ACT.foodOverall = (el) => { const l = ensureLog(el.dataset.d); l.overall = el.dataset.v; if (el.dataset.v === 'yes') st.food.goals.filter((g) => g.on).forEach((g) => { l.met[g.id] = true; }); save(); refreshFood(el.dataset.d); };
ACT.foodNote = (el) => { ensureLog(el.dataset.d).note = el.value; save(); };
ACT.foodQuick = (el) => {

async function startWorkout(r, o = {}) {

    if (!ok) return;
  }
  const feel = o.feel || 3;
  const R = withTargets(r, feel);
  const circuit = R.format === 'circuit';
  const items = R.items.filter((it) => getEx(it.ex)).map((it) => {
    const e = getEx(it.ex);
    const warm = !!it.warm || it.note === 'Warm-up', cool = !!it.cool || it.note === 'Cool-down';
    const circ = circuit && !warm && !cool;
    return { ex: it.ex, note: it.note && !['Warm-up', 'Cool-down'].includes(it.note) ? it.note : '', warm, cool, circ, rest: it.rest ?? 30,
      sets: Array.from({ length: Math.max(1, it.sets || 1) }, () => ({ t: it.v, w: it.w ?? null, v: null, done: false, skip: false })), u: circ ? 'sec' : e.u };
  });

    for (let rd = 0; rd < (R.rounds || 1); rd++) items.forEach((it, i) => { if (it.circ && it.sets[rd]) steps.push({ i, s: rd, rd }); });
    items.forEach((it, i) => { if (it.cool) it.sets.forEach((_, s) => steps.push({ i, s })); });

/* ---------------- charts ---------------- */
const RANGES = [[28, '4W'], [84, '12W'], [182, '6M'], [365, '1Y'], [0, 'All']];

  const from0 = rangeDays ? E_.addDays(t, -rangeDays + 1) : first;

  } else {
    for (let a = E_.weekStartOf(from0, st.settings.weekStart); a <= t; a = E_.addDays(a, 7)) { const d = E_.parse(a); out.push({ x: a, l: `${E_.MON[d.getMonth()]} ${d.getDate()}`, tip: `Week of ${E_.fmtDate(a)}`, v: m.fn(st, a, E_.addDays(a, 6)), cur: E_.addDays(a, 6) >= t }); }

  const keep = new Set(def.moves.filter((id) => avail.some((x) => x.id === id)));
  const used = new Set(keep);
  const shuffled = E_.shuffle([...avail]).sort((a, b) => HIIT.metaOf(b).i - HIIT.metaOf(a).i);
  def.moves = def.moves.map((id) => {

  <div class="pl-body"><div class="center"><div class="plan-ic done" style="margin:0 auto 8px;width:56px;height:56px;border-radius:18px">${ic('bolt', 'lg')}</div><h2 style="font-size:24px">Crushed it!</h2><div class="small muted">${esc(a.name)}</div></div>
    <div class="g4"><div class="kpi"><span>Time</span><b>${dur}</b><span>min</span></div>${am ? `<div class="kpi"><span>Rounds</span><b>${a.amrap.rounds}</b><span>completed</span></div>` : `<div class="kpi"><span>Intervals</span><b>${S.intervals}</b><span>done</span></div>`}<div class="kpi"><span>Reps</span><b>${S.reps}</b><span>counted</span></div><div class="kpi"><span>Burn</span><b>${kcal}</b><span>kcal est.</span></div></div>
    ${am ? `<div class="card center"><div class="lbl">AMRAP score</div><div style="font-size:36px;font-weight:800">${a.amrap.rounds} rounds${a.amrap.idx % am.list.length ? ' + ' + (a.amrap.idx % am.list.length) : ''}</div>${prevScore != null ? `<div class="small t2">Last time: ${prevScore} rounds ${a.amrap.rounds > prevScore ? '· new best! 🎉' : ''}</div>` : ''}</div>` : ''}
    <div class="card"><h3 style="margin-bottom:10px">How hard was it?</h3><div class="fb-opts">${[1, 2, 3, 4, 5].map((i) => `<button class="${r === i ? 'on' : ''}" data-a="tlRate" data-v="${i}"><b>${i}</b>${EFFORT[i]}</button>`).join('')}</div></div>
    ${r != null && a.def.fmt !== 'amrap' ? `<div class="card"><h3>Next HIIT session</h3><div class="small muted" style="margin:2px 0 8px">${sugg === 'up' ? 'That felt easy, so we suggest more work and less rest next time.' : sugg === 'down' ? 'That was very hard, so we suggest a little more rest next time.' : 'Feels right, so keep the same timing.'}</div>
      <div class="seg">${[['down', 'Easier'], ['same', 'Same'], ['up', 'Harder']].map(([k, l]) => `<button class="${ui.fb.adj === k ? 'on' : ''}" data-a="tlAdj" data-v="${k}">${l}</button>`).join('')}</div>
      <div class="small t2" style="margin-top:8px">Intervals will be <b>${40 + (lvl + (ui.fb.adj === 'up' ? 1 : ui.fb.adj === 'down' ? -1 : 0)) * 5}s work / ${Math.max(5, 20 - (lvl + (ui.fb.adj === 'up' ? 1 : ui.fb.adj === 'down' ? -1 : 0)) * 5)}s rest</b> (for a moderate session).</div></div>` : ''}
    <label class="field"><span>Notes (optional)</span><textarea data-in="fbNote">${esc(ui.fb.notes)}</textarea></label></div>
  <div class="pl-foot"><button class="btn" data-a="tlBack">Back</button><button class="btn pri lg" data-a="tlSave">${ic('check')} Save workout</button></div>`;
}
ACT.tlRate = (...args) => { if (!TL() || TL().format !== 'timeline') { closeSheet(true); return; } return ACT_tlRate(...args); };
const ACT_tlRate = (el) => { ui.fb.rating = +el.dataset.v; ui.fb.touched = false; renderPlayer(); };
ACT.tlAdj = (...args) => { if (!TL() || TL().format !== 'timeline') { closeSheet(true); return; } return ACT_tlAdj(...args); };
const ACT_tlAdj = (el) => { ui.fb.adj = el.dataset.v; ui.fb.touched = true; renderPlayer(); };
ACT.tlBack = (...args) => { if (!TL() || TL().format !== 'timeline') { closeSheet(true); return; } return ACT_tlBack(...args); };
const ACT_tlBack = () => { const a = TL(); a.phase = 'paused'; a.left = tlSeg().secs; if (a.si >= a.segs.length) a.si = a.segs.length - 1; a.pauseAt = Date.now(); a.paused += 0; save(); openPlayer(); };
ACT.tlSave = (...args) => { if (!TL() || TL().format !== 'timeline') { closeSheet(true); return; } return ACT_tlSave(...args); };
const ACT_tlSave = () => {
  const a = TL(), S = tlStats();
  const dur = Math.max(1, Math.round(elapsed() / 60));
  const kg = E_.curWeight(st) || 80;
  const h = HIIT.hs(st);
  if (ui.fb.adj === 'up') h.lvl = Math.min(3, (h.lvl || 0) + 1); else if (ui.fb.adj === 'down') h.lvl = Math.max(-3, (h.lvl || 0) - 1);
  const am = a.segs.find((s) => s.t === 'amrap');
  const d = new Date(a.started);
  const items = Object.entries(S.per).map(([ex, sets]) => ({ ex, sets: sets.map((x) => ({ v: x.v, t: x.t })) }));
  const cardioMin = a.def.fmt === 'sprint' ? dur : 0;
  const s = { id: a.id, date: E_.ds(d), time: `${E_.pad(d.getHours())}:${E_.pad(d.getMinutes())}`, dur, kind: a.def.fmt === 'sprint' ? 'cardio' : 'hiit', name: a.name, items, effort: ui.fb.rating, notes: ui.fb.notes, plan: a.planRef || null, intervals: S.intervals, repCount: S.reps || null, cardioMin, kcal: Math.round((a.def.fmt === 'sprint' ? 8 : 8.5) * kg * dur / 60 * 0.9), src: 'hiit', fmt: a.def.fmt };
  if (am) s.score = a.amrap.rounds + Math.round((a.amrap.idx % am.list.length) / am.list.length * 10) / 10;
  st.sessions.push(s);
  st.active = null; save(); closePlayer(); ui.tab = 'today'; render();
  toast(`HIIT saved${s.score != null ? ` · score ${s.score}` : ''} 🔥`);
};

boot();
</script>
<script>if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){});});}</script>
</body>
